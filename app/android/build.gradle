buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
        // Required by react-native-in-app-review's Android build.gradle (safeExtGet with
        // no fallback — build fails without these). The split `com.google.android.play:review`
        // artifact, not the deprecated monolithic `com.google.android.play:core` (which has
        // an android:exported manifest issue Play Console flags for apps targeting API 31+).
        playReviewVersion = "2.0.2"
        playServicesVersion = "18.10.1"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
